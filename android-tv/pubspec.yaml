name: angel_live_android_tv
description: Independent Android TV client compatible with the Angel Live plugin API.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.9.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  archive: 4.0.7
  crypto: 3.0.6
  path: 1.9.1
  path_provider: 2.1.5
  media_kit: 1.2.2
  media_kit_video: 1.3.1
  media_kit_libs_video: 1.0.7
  qr_flutter: 4.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 5.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/host.js
    - assets/worker.js
    - assets/bootstrap.json
