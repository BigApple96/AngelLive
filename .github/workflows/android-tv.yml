name: Android TV APK

on:
  push:
    branches: [main, codex/android-tv-compat]
    paths: ['android-tv/**', '.github/workflows/android-tv.yml']
  pull_request:
    paths: ['android-tv/**', '.github/workflows/android-tv.yml']
  workflow_dispatch:
    inputs:
      mode:
        description: 'auto: use configured signing; preview: separate package; signed: require secrets'
        type: choice
        options: [auto, preview, signed]
        default: auto

permissions:
  contents: read

concurrency:
  group: android-tv-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: android-tv
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            android-tv
            .github
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.3'
          channel: stable
          cache: true
      - name: Install pinned Android toolchain
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
      - name: Resolve locked dependencies
        run: |
          chmod +x android/gradlew
          flutter pub get --enforce-lockfile
      - name: Analyze and test
        run: |
          flutter analyze --no-pub
          flutter test --no-pub --reporter expanded
          python3 -m unittest discover -s scripts/tests -v
      - name: Prepare isolated preview configuration
        env:
          REQUESTED_BUILD: preview
        run: python3 scripts/ci_prepare.py
      - name: Reject signing on a non-default branch
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'signed' && github.ref_name != github.event.repository.default_branch
        run: |
          echo 'Signed builds require the trusted default branch.'
          exit 1
      - name: Configure trusted default-branch build
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        env:
          REQUESTED_BUILD: ${{ inputs.mode || 'auto' }}
          TV_KEYSTORE_BASE64: ${{ secrets.TV_KEYSTORE_BASE64 }}
          TV_STORE_PASSWORD: ${{ secrets.TV_STORE_PASSWORD }}
          TV_KEY_ALIAS: ${{ secrets.TV_KEY_ALIAS }}
          TV_KEY_PASSWORD: ${{ secrets.TV_KEY_PASSWORD }}
          TV_PLUGIN_SOURCE_URL: ${{ secrets.TV_PLUGIN_SOURCE_URL }}
        run: python3 scripts/ci_prepare.py
      - name: Build ARM32 and ARM64 APK
        run: flutter build apk --release --no-pub --target-platform android-arm,android-arm64 --build-number "$GITHUB_RUN_NUMBER"
      - name: Verify and package artifact
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/AngelLive-TV-${CI_BUILD_MODE}.apk"
          python3 scripts/verify_apk.py "dist/AngelLive-TV-${CI_BUILD_MODE}.apk" --expected-package "$CI_PACKAGE_ID" --output dist/artifact.json
          cp LICENSE dist/LICENSE.txt
          cp THIRD_PARTY_NOTICES.md dist/THIRD_PARTY_NOTICES.md
          cp -R third_party_licenses dist/third_party_licenses
          cd dist
          sha256sum ./*.apk artifact.json > SHA256SUMS.txt
      - name: Upload APK and verification metadata
        uses: actions/upload-artifact@v4
        with:
          name: android-tv-apk
          path: android-tv/dist/
          if-no-files-found: error
          retention-days: 30
      - name: Remove ephemeral signing files
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for name in ['android/key.properties', 'android/ci-release.jks']:
              Path(name).unlink(missing_ok=True)
          PY
